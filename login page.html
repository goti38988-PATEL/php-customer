<!DOCTYPE html>
<html>
<head>
<title>VConnect IT - Login</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f172a,#2563eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

p{
text-align:center;
}

</style>
</head>

<body>

<div class="login-box">

<h2>VConnect IT</h2>

<p>Customer Portal Login</p>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
